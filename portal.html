<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WoW Character Generator - Portal</title>
  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="stylesheet" href="assets/css/portal.css">
  <script type="module" src="script.js"></script>
  <script src="assets/js/audiohandler.js"></script>
</head>
<body class="preload">
  <div class="noSelect" id="portalOverlay">

    <!-- LOGO -->
    <button class="xPacButton" id="logo" onclick="manualChangeExpac(); playButtonAudio(1);"></button>

    <!-- GHUB AND OPTIONS BUTTONS -->
    <div id="quitButtonContainer" class="foreground">
      <button id="optButton" class="button" onclick="playButtonAudio(0); showSettings();">Options</button>
      <button id="quitButton" class="button" onclick="location.href='https://github.com/InzataFreeTV/WoW-RCG'; playButtonAudio(0);">GitHub</button>
    </div>

    <!-- OPTIONS PANEL -->
    <div class="centered" id="options" style="display: none">
      <div class="UIBox" style="width: 450px; height: 15px"></div>
      <div class="UIBoxBackground" style="width: 500px; height: 75px"></div>
      <div class="slidecontainer">
        <p class="text" style="position: fixed; margin-top: 0;">Sound</p>
        <input type="range" min="0" max="100" value="30" class="slider" id="volumeSlider" oninput="adjustVolume();">
      </div>
    </div>

    <!-- MAIN BOX -->
    <div class="centered">
      <div class="UIBox" style="width: 450px; height: 100px"></div>
      <div class="UIBoxBackground" style="width: 500px; height: 150px"></div>
      <div id="mainTextContainer">
        <p class="mainText">World of Warcraft</p>
        <p class="mainText">Randomized Character Creator</p>
        <p class="mainText">Made by Inzata</p>
      </div>
      <button class="button" id="enterBtn" onclick="playButtonAudio(0); startGeneratorTransition();">Enter</button>
    </div>

    <!-- COPYRIGHT TEXT -->
    <div class="fullWidth">
      <p id="copyrightText">2004-2026 World of Warcraft is a trademark or registered trademark of Blizzard Entertainment. This is a fan-made tool.</p>
    </div>

    <!-- BUILD VERSION -->
    <p id="buildVersion">Version 12.0.0 (Release x64)</p>

    <!-- BUILD DATE -->
    <p id="buildDate">Jan 22 2026</p>

    <!-- BACKGROUND VIDEO -->
    <div class="fullScreen">
      <div class="centered">
        <video autoplay muted loop id="background">
          <source src="assets/img/bg/Midnight.webm" type="video/webm">
          <source src="assets/img/bg/Midnight.mp4" type="video/mp4">
        </video>
      </div>
    </div>

    <!-- TRANSITION LOGO OVERLAY -->
    <div id="transitionLogo" class="transition-logo">
      <img src="assets/img/ui/logos/Midnight.png" alt="Midnight Logo">
    </div>
  </div>
  <script>
    // Fade-in after load
    document.addEventListener('DOMContentLoaded', ()=> {
      document.body.classList.remove('preload');
    });
  </script>
</body>
</html>
